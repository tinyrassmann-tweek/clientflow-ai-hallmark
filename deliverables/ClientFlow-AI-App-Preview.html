const agents = [

 ['Niche Architect','Research','Define an audience and a practical validation plan.'],
 ['VSL Builder OS','Content','Structure a video sales letter, scene by scene.'],

const id=()=>{if(crypto.randomUUID)return crypto.randomUUID();const a=crypto.getRandomValues(new Uint8Array(16));a[6]=(a[6]&15)|64;a[8]=(a[8]&63)|128;const h=[...a].map(x=>x.toString(16).padStart(2,'0')).join('');return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20);};
const fail=(status,message)=>{throw Object.assign(new Error(message),{status});};
const json=(data,status=200)=>new Response(JSON.stringify(data),{status,headers:{'Content-Type':'application/json; charset=utf-8','Cache-Control':'no-store'}});
const clean=(v,max=4000)=>String(v??'').trim().slice(0,max);
const email=v=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
async function body(req){if(Number(req.headers.get('content-length')||0)>100000)fail(413,'This request is too large.'); const t=await req.text();if(t.length>100000)fail(413,'This request is too large.');try{return JSON.parse(t);}catch{fail(400,'Send valid JSON.');}}
function emptyWorkspace(name,user){return {id:id(),name:clean(name,90)||'My client workspace',createdAt:new Date().toISOString(),owner:user.id,plan:'Owner workspace',ventures:[...ventures],contacts:[],offers:[],assets:[],workflows:[],tasks:[],activity:[],settings:{business:'',audience:'',voice:'Direct, warm, specific. No inflated promises.'}};}

 {id:'c1',name:'Maya Johnson',company:'Juniper Studio',email:'maya@example.com',stage:'Proposal',value:4800,venture:ventures[1],nextAction:'Review scope together',due:'2026-11-12',notes:'Sample client record',createdAt:'2026-11-05T10:00:00Z'},
 {id:'c2',name:'Daniel Chen',company:'Northline Consulting',email:'daniel@example.com',stage:'Qualified',value:3200,venture:ventures[6],nextAction:'Schedule discovery',due:'2026-11-10',notes:'Sample client record',createdAt:'2026-11-06T10:00:00Z'},
 {id:'c3',name:'Elena Rivera',company:'Common Ground',email:'elena@example.com',stage:'New lead',value:6500,venture:ventures[0],nextAction:'Read intake',due:'2026-11-09',notes:'Sample client record',createdAt:'2026-11-08T10:00:00Z'},
 {id:'c4',name:'Sam Taylor',company:'Evergreen Collective',email:'sam@example.com',stage:'Won',value:2400,venture:ventures[1],nextAction:'Welcome and kickoff',due:'2026-11-11',notes:'Sample client record',createdAt:'2026-11-03T10:00:00Z'}];w.tasks=[{id:'t1',title:'Review Juniper proposal',due:'2026-11-12',done:false,venture:ventures[1]},{id:'t2',title:'Prepare Northline discovery',due:'2026-11-10',done:false,venture:ventures[6]},{id:'t3',title:'Confirm Evergreen kickoff',due:'2026-11-11',done:true,venture:ventures[1]}];return w;}
function template(agent,b){const biz=clean(b.business,160)||'Your business', audience=clean(b.audience,500)||'your ideal client', problem=clean(b.problem,1600)||'the problem your clients need help solving', outcome=clean(b.outcome,1000)||'a clear, measurable outcome', price=Math.min(10000,Math.max(2000,Number(b.price)||3500)), scope=clean(b.scope,2000)||'Discovery; implementation; handoff', source=clean(b.sources,12000);
 const head=`${agent}\n${biz} · Working draft\n\n`;
 const common=`AUDIENCE\n${audience}\n\nCLIENT NEED\n${problem}\n\nDESIRED OUTCOME\n${outcome}`;
 const maps={
 'Offer Architect':`${biz}: a focused implementation offer\n\n${common}\n\nOFFER\nWe help ${audience} work toward ${outcome} through a defined implementation plan.\n\nSCOPE\n${scope.split(/[;\n]/).filter(Boolean).map((x,i)=>`${i+1}. ${x.trim()}`).join('\n')}\n\nPROPOSED PRICE\n$${price.toLocaleString('en-US')} one time. Validate scope and delivery costs before publishing.\n\nDELIVERY\nDiscovery → agreed scope → implementation → client review → handoff.\n\nBOUNDARIES\nConfirm timeline, revision allowance, dependencies, acceptance criteria, and exclusions in the agreement.\n\nNEXT STEP\nBook a fit conversation to confirm the problem and decide whether to proceed.`,
 'Niche Architect':`${common}\n\nWORKING NICHE\n${audience} who need support with ${problem}.\n\nVALIDATION PLAN\n1. Interview five potential clients about their current process.\n2. Ask what the problem costs them in time or missed work.\n3. Identify the decision maker and buying trigger.\n4. Test one scoped paid pilot.\n5. Record objections before changing the offer.\n\nEVIDENCE\n${source||'No evidence supplied. Market size, demand, and profitability remain unverified.'}`,
 'VSL Builder OS':`VIDEO SALES LETTER — SCRIPT OUTLINE\n\n0:00 — Recognition\nIf ${problem} keeps getting in the way, start here.\n\n0:20 — The goal\nFor ${audience}, the goal is ${outcome}.\n\n0:45 — The process\nShow these steps in the actual product: ${scope}.\n\n1:30 — Demonstration\nUse a real example with permission. Show the before, the action, and the result. Do not invent proof.\n\n2:15 — The offer\nExplain scope, delivery, price, and who it fits.\n\n2:45 — Invitation\nBook a conversation with ${biz} to review your needs.`,
 'Ads Architect':`CAMPAIGN BRIEF\n\n${common}\n\nANGLE 1 — Clarity\nHeadline: A clearer way to work toward ${outcome}.\nBody: ${biz} helps ${audience} put a practical plan around ${problem}. Review the process, scope, and next step.\nCTA: Explore the approach\n\nANGLE 2 — Process\nHeadline: Know the next step.\nBody: From discovery to handoff, keep the work connected. See how ${biz} approaches ${problem}.\nCTA: See the workflow\n\nTEST PLAN\nTest one variable at a time. Record spend, qualified inquiries, cost per inquiry, and downstream conversion. Platform publishing requires a connected account and approval.`,
 'Category Architect':`${common}\n\nPOSITIONING STATEMENT\n${biz} helps ${audience} work toward ${outcome} with a clear delivery system.\n\nCATEGORY HYPOTHESIS\nA focused implementation partner for ${problem}. Validate this language with buyers.\n\nDIFFERENTIATION TO VERIFY\nDefine your method, proof, delivery boundaries, and fit. Compare against real alternatives before making comparative claims.\n\nPROOF REQUIRED\nA process demonstration, a scoped deliverable, and permission-based client evidence.`,
 'Sales Asset Architect':`SOURCE-BASED SALES KIT\n\nSOURCE NOTES\n${source||'No transcript supplied. Add consented source notes before treating this as a finished asset.'}\n\nFOLLOW-UP DRAFT\nThanks for sharing what is happening at ${biz}. You described the need to address ${problem}. The next step is to confirm scope and decide whether ${outcome} is the right target.\n\nPROPOSAL FRAME\nContext → desired result → scope (${scope}) → investment → responsibilities → acceptance.\n\nOBJECTION WORKSHEET\nRecord the exact concern, the available evidence, and the next question. Do not manufacture client quotes.`,
 'Landing Page Copywriter':`HERO\nA practical path toward ${outcome}.\n\nINTRODUCTION\n${biz} helps ${audience} address ${problem} with a clear plan and defined deliverables.\n\nHOW IT WORKS\n${scope.split(/[;\n]/).filter(Boolean).map((x,i)=>`${i+1}. ${x.trim()}`).join('\n')}\n\nWHAT YOU RECEIVE\nList the actual outputs, format, delivery timeline, and revision policy.\n\nFIT\nFor clients ready to confirm scope and participate in delivery.\n\nCALL TO ACTION\nTell us what you need help with.\n\nBEFORE PUBLISHING\nVerify every claim, price, policy, link, and proof point.`,
 'Research Agent':`${common}\n\nSOURCE REGISTER\n${source?source.split('\n').filter(Boolean).map((x,i)=>`[${i+1}] ${x}`).join('\n'):'No sources supplied. This is a research plan, not a factual report.'}\n\nRESEARCH QUESTIONS\n1. How does this audience currently address the problem?\n2. Which alternatives are actually used?\n3. What evidence supports willingness to pay?\n4. Which delivery dependencies create risk?\n\nFINDINGS\nNo independently verified findings have been generated in template mode. Link each future finding to a supplied source and record its date.\n\nNEXT ACTION\nCollect primary sources and customer interviews; separate observations from assumptions.`};
 return head+(maps[agent]||maps['Offer Architect'])+(source.startsWith('Previous specialist output')?'\n\nWORKING CONTEXT FROM THE PREVIOUS SPECIALIST\n'+source.slice(0,6000):'');}

async function token(){let t;try{t=JSON.parse(sessionStorage.getItem('cf-auth')||'null');}catch{}if(!t)return '';if(t.expires<Date.now()+60000&&t.refresh){const config=await fetch('/api/config').then(r=>r.json());const r=await fetch('https://securetoken.googleapis.com/v1/token?key='+encodeURIComponent(config.firebaseApiKey),{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'refresh_token',refresh_token:t.refresh})});if(r.ok){const n=await r.json();t={token:n.id_token,refresh:n.refresh_token,expires:Date.now()+Number(n.expires_in)*1000};sessionStorage.setItem('cf-auth',JSON.stringify(t));}else{sessionStorage.removeItem('cf-auth');return '';}}return t.token;}
async function request(path,method='GET',data){const t=await token();const r=await fetch('/api'+path,{method,headers:{...(t?{Authorization:'Bearer '+t}:{}),...(data!==undefined?{'Content-Type':'application/json'}:{})},...(data!==undefined?{body:JSON.stringify(data)}:{})});const b=await r.json();if(!r.ok)throw Object.assign(Error(b.error||'The request could not be completed.'),{status:r.status});return b;}

function offerEditor(rid){const o=rid?w.offers.find(x=>x.id===rid):{};dialog(`<h2>${rid?'Give the offer a clear shape.':'Build an offer around a need.'}</h2><form id="edit-form">${label('Offer name','title',o.title,'text',true)}<div class="form-row">${label('Audience','audience',o.audience||w.settings.audience,'text',true)}${label('Proposed investment ($)','price',o.price||3500,'number',true)}</div><label>The problem to solve<textarea name="problem" rows="2" required maxlength="1500">${esc(o.problem)}</textarea></label><label>The intended outcome<textarea name="outcome" rows="2" required maxlength="1000">${esc(o.outcome)}</textarea></label><label>What is included? One deliverable per line.<textarea name="scope" rows="3" required maxlength="3000">${esc(o.scope||'Discovery and agreed scope\nImplementation\nClient review and handoff')}</textarea></label><div class="form-row">${ventureField(o.venture)}<label>Offer status<select name="status">${listOptions(['Draft','Ready for review','Approved'],o.status||'Draft')}</select></label></div>${rid?`<details><summary>View the saved offer draft</summary><pre class="output-text">${esc(o.body)}</pre></details>`:''}<div class="dialog-actions">${rid?action('download-offer','Export offer','btn secondary left-action',`data-id="${rid}"`):''}${action('close-dialog','Cancel','btn secondary')}<button class="btn" type="submit">Save offer & draft </button></div></form>`);bindForm(async b=>{b.price=Number(b.price);b.body=template('Offer Architect',{...b,business:b.title});await save('offers',b,rid);close();render();toast('Offer and structured draft saved.');});}
function specialistEditor(index){const agent=agents[Number(index)][0];dialog(`<h2>${agent}</h2><p>A specific brief makes more useful work. Review the result before using it.</p><form id="edit-form">${label('Business or offer name','business',w.settings.business||w.name,'text',true)}<label>Your audience<textarea name="audience" rows="2" required maxlength="1000">${esc(w.settings.audience)}</textarea></label><label>What problem needs to be addressed?<textarea name="problem" rows="2" required maxlength="2000"></textarea></label>${label('Desired outcome','outcome','','text',true)}<div class="form-row">${label('Scope / delivery steps','scope','Discovery; implementation; handoff')}${label('Proposed price ($)','price',3500,'number')}</div><label>Source notes, transcript excerpts, and URLs${agent==='Research Agent'?' (required)':''}<textarea name="sources" rows="3" maxlength="12000" ${agent==='Research Agent'?'required':''} placeholder="Use only material you have permission to share. Include a URL and date for source citations."></textarea></label><div class="form-row">${ventureField(venture==='All ventures'?null:venture)}<label>Drafting mode<select name="mode"><option value="template">Structured template</option><option value="ai" ${!session.ai||demo?'disabled':''}>AI generation ${session.ai&&!demo?'':'(not connected)'}</option></select></label></div><div class="dialog-actions">${action('close-dialog','Cancel','btn secondary')}<button class="btn" type="submit">Create review draft </button></div></form>`);bindForm(async b=>{let a;if(demo){a=await save('assets',{title:b.business+' / '+agent,agent,body:template(agent,b),mode:'Template draft',status:'Draft',venture:b.venture});}else a=await request('/workspace/'+w.id+'/generate','POST',{...b,agent,useAI:b.mode==='ai'});await reload(false);page='delivery';location.hash='delivery';render();assetEditor(a.id);toast('Draft created. Ready for your review.');});}
function assetEditor(rid){const a=w.assets.find(x=>x.id===rid);if(!a)return;dialog(`<h2>${esc(a.title)}</h2><p>Status: <strong>${esc(a.status)}</strong>${a.approvedBy?' / Approved by '+esc(a.approvedBy):''}</p><form id="edit-form">${label('Deliverable title','title',a.title,'text',true)}<label>Content<textarea class="asset-body" name="body" rows="13" required maxlength="30000">${esc(a.body)}</textarea></label>${a.status==='Approved'?label('Live HTTPS URL (required to record deployment)','deploymentUrl',a.deploymentUrl,'url'):a.deploymentUrl?`<p>Recorded live URL: <a class="link-button" href="${esc(a.deploymentUrl)}" target="_blank" rel="noopener">${esc(a.deploymentUrl)} </a></p>`:''}<div class="dialog-actions">${action('download-asset','Export HTML','btn secondary left-action',`data-id="${a.id}"`)}<button class="btn secondary" type="submit">Save edits</button>${a.status==='Draft'?action('stage-asset','Stage for review','btn',`data-id="${a.id}"`):a.status==='Staged'?action('approve-asset','Approve draft','btn',`data-id="${a.id}"`):a.status==='Approved'?action('deploy-asset','Record deployment','btn',`data-id="${a.id}"`):''}</div><p class="footnote">Editing approved or deployed content returns it to draft. Export the reviewed content to publish through your chosen service.</p></form>`);bindForm(async b=>{await save('assets',b,a.id);close();render();toast('Edits saved.');});}
function taskEditor(){dialog(`<h2>What needs to move?</h2><form id="edit-form">${label('Task','title','','text',true)}<div class="form-row">${label('Due date','due','','date')}${ventureField(venture==='All ventures'?null:venture)}</div><div class="dialog-actions">${action('close-dialog','Cancel','btn secondary')}<button class="btn" type="submit">Add task</button></div></form>`);bindForm(async b=>{await save('tasks',{...b,done:false});close();render();toast('Next step added.');});}
function workflowEditor(rid,preset){const f=rid?w.workflows.find(x=>x.id===rid):flowPresets[preset]||{};dialog(`<h2>A process you can repeat.</h2><form id="edit-form">${label('Workflow name','title',f.title,'text',true)}${label('When should this process begin?','trigger',f.trigger)}<label>Steps: one per line<textarea name="steps" rows="7" required maxlength="3000">${esc((f.steps||[]).map(x=>typeof x==='string'?x:x.title).join('\n'))}</textarea></label>${ventureField(f.venture)}<div class="dialog-actions">${action('close-dialog','Cancel','btn secondary')}<button class="btn" type="submit">Save workflow</button></div><p class="footnote">This is a manual checklist. No messages or external actions are executed.</p></form>`);bindForm(async b=>{b.steps=b.steps.split('\n').filter(x=>x.trim()).slice(0,12).map(title=>({title:title.trim(),done:f.steps?.find(s=>s.title===title.trim())?.done||false}));if(!b.steps.length)throw Error('Add at least one step.');await save('workflows',b,rid);close();render();toast('Workflow saved.');});}
function chainEditor(){dialog(`<h2>One brief. A connected set of drafts.</h2><p>Run Offer Architect, Landing Page Copywriter, then Ads Architect in order. Each specialist receives the previous draft as context. All results are saved as drafts for review. Keep this tab open while the chain runs.</p><form id="edit-form">${label('Business / campaign name','business',w.settings.business||w.name,'text',true)}${label('Audience','audience',w.settings.audience,'text',true)}<label>Problem to address<textarea name="problem" rows="2" required></textarea></label>${label('Intended outcome','outcome','','text',true)}${label('Scope and delivery steps','scope','Discovery; implementation; handoff')}<div class="form-row">${ventureField()}<label>Drafting mode<select name="mode"><option value="template">Structured templates</option><option value="ai" ${!session.ai||demo?'disabled':''}>AI generation</option></select></label></div><div class="dialog-actions">${action('close-dialog','Cancel','btn secondary')}<button class="btn" type="submit">Run three-specialist chain </button></div></form>`);bindForm(async b=>{const chain=['Offer Architect','Landing Page Copywriter','Ads Architect'],outputs=[];let sources='';for(let i=0;i<chain.length;i++){let progress=$('#chain-progress');if(!progress){progress=document.createElement('p');progress.id='chain-progress';progress.setAttribute('role','status');$('#edit-form').append(progress);}progress.textContent='Step '+(i+1)+' of 3: '+chain[i]+'…';try{let a;if(demo)a=await save('assets',{title:b.business+' / '+chain[i],agent:chain[i],body:template(chain[i],{...b,sources}),mode:'Template draft',status:'Draft',venture:b.venture});else a=await request('/workspace/'+w.id+'/generate','POST',{...b,sources,agent:chain[i],useAI:b.mode==='ai'});outputs.push(a);sources='Previous specialist output: treat as a working draft, not verified evidence:\n'+a.body;}catch(e){throw Error('Chain stopped at step '+(i+1)+'. '+outputs.length+' completed drafts are saved. '+e.message);}}await reload(false);close();page='delivery';location.hash='delivery';render();toast('Three connected drafts created. Review each before use.');});}
function download(name,text,type='text/plain'){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);}
function downloadHtml(title,body){download(title.replace(/[^a-z0-9]/gi,'-').slice(0,70)+'.html','<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(title)+'</title><style>:root{--color-muted:#616455}body{max-width:800px;margin:50px auto;padding:30px;background:#f8f6f0;color:var(--color-muted);font:16px/1.8 Georgia}h1{font-weight:400;color:var(--color-muted)}pre{font:14px/1.9 Arial;white-space:pre-wrap;overflow-wrap:anywhere}footer{border-top:1px solid #d9d4c3;margin-top:40px;padding-top:20px;font:11px Arial;color:var(--color-muted)}</style><h1>'+esc(title)+'</h1><pre>'+esc(body)+'</pre><footer>ClientFlow AI / Working deliverable / Review before publishing</footer></html>','text/html');}
function csvCell(v){let s=String(v??'');if(/^[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"';}
function parseCsv(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++;}else quoted=!quoted;}else if(c===','&&!quoted){row.push(cell);cell='';}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell='';}else cell+=c;}if(cell||row.length){row.push(cell);rows.push(row);}if(quoted)throw Error('A quoted CSV cell is not closed.');return rows;}

 if(['stage-asset','approve-asset','deploy-asset'].includes(a)){const asset=w.assets.find(x=>x.id===rid),data=Object.fromEntries(new FormData($('#edit-form')));if(data.body!==asset.body||data.title!==asset.title)throw Error('Save your edits before changing review status.');const status=a==='stage-asset'?'Staged':a==='approve-asset'?'Approved':'Deployed';if(status==='Deployed'&&!/^https:\/\//.test(data.deploymentUrl||''))throw Error('Add a valid HTTPS live URL first.');await save('assets',{status,...(status==='Deployed'?{deploymentUrl:data.deploymentUrl}:{})},rid);assetEditor(rid);render();toast(status==='Deployed'?'External deployment recorded.':'Deliverable '+status.toLowerCase()+'.');return;}

 if(a==='import-csv'){dialog(`<h2>Bring your contacts with you.</h2><p>CSV headers: name (required), company, email, stage, value, venture, nextAction, due, notes. Import up to 100 rows at a time. Existing matching emails are skipped.</p><form id="edit-form"><label>CSV file<input type="file" id="csv-file" accept=".csv,text/csv" required></label><div class="dialog-actions">${action('close-dialog','Cancel','btn secondary')}<button class="btn" type="submit">Import contacts</button></div></form>`);bindForm(async()=>{const file=$('#csv-file').files[0];if(file.size>200000)throw Error('Use a file smaller than 200 KB.');const rows=parseCsv((await file.text()).replace(/^\uFEFF/,''));const keys=rows.shift()?.map(x=>x.trim());if(!keys?.includes('name'))throw Error('Include a name column in the header.');if(rows.length>100)throw Error('Import 100 rows or fewer.');let added=0,skipped=0;for(const row of rows){const b=Object.fromEntries(keys.map((k,i)=>[k,row[i]||'']));if(!b.name){skipped++;continue;}if(b.email&&w.contacts.some(c=>c.email?.toLowerCase()===b.email.toLowerCase())){skipped++;continue;}b.stage=stages.includes(b.stage)?b.stage:'New lead';b.venture=w.ventures.includes(b.venture)?b.venture:w.ventures[0];b.value=Number(String(b.value).replace(/[$,]/g,''))||0;try{await save('contacts',b);added++;}catch(e){render();throw Error(added+' contacts saved before an error: '+e.message+' Correct remaining rows and reimport. Matching emails will be skipped.');}}close();render();toast(added+' contacts imported; '+skipped+' skipped.');});return;}

document.addEventListener('submit',async e=>{if(e.target.id==='settings-form'){e.preventDefault();const b=Object.fromEntries(new FormData(e.target));try{if(demo){w.settings=b;persist();}else{w=await request('/workspace/'+w.id+'/settings','POST',b);}toast('Business context saved.');}catch(err){toast(err.message);}}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.contact-card')){e.preventDefault();contactEditor(e.target.dataset.id);}});
document.addEventListener('dragstart',e=>{const card=e.target.closest('[data-drag-id]');if(card){dragging=card.dataset.dragId;e.dataTransfer.setData('text/plain',dragging);}});document.addEventListener('dragover',e=>{const col=e.target.closest('[data-drop-stage]');if(col){e.preventDefault();col.classList.add('drag-over');}});document.addEventListener('dragleave',e=>e.target.closest('[data-drop-stage]')?.classList.remove('drag-over'));document.addEventListener('drop',async e=>{const col=e.target.closest('[data-drop-stage]');if(!col||!dragging)return;e.preventDefault();const rid=dragging;dragging=null;try{await save('contacts',{stage:col.dataset.dropStage},rid);render();toast('Client moved.');}catch(err){toast(err.message);render();}});
function syncSidebar(){ $('#sidebar').inert=matchMedia('(max-width:60rem)').matches&&!$('#sidebar').classList.contains('open');}matchMedia('(max-width:60rem)').addEventListener('change',syncSidebar);syncSidebar();
$('#app-menu').addEventListener('click',()=>{const open=$('#sidebar').classList.toggle('open');$('#app-menu').setAttribute('aria-expanded',open);syncSidebar();});
window.addEventListener('hashchange',async()=>{page=location.hash.slice(1)||'overview';if(page==='inbox'&&!demo&&session?.isOwner){try{inbox=await request('/inbox');}catch(e){toast(e.message);}}render();});
await boot();
</script></body></html>
